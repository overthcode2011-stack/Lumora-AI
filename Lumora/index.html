<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumora AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h4"/></symbol>
<symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 4v7h-7"/></symbol>
<symbol id="i-thumb" viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></symbol>
</defs></svg>
<div class="app">
 <aside id="side">
  <div class="brand"><svg class="i"><use href="#i-spark"/></svg><span>Lumora AI</span></div>
  <button class="newbtn" id="new"><svg class="i"><use href="#i-plus"/></svg>Nuevo chat</button>
  <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" placeholder="Buscar chats por nombre" autocomplete="off"></label>
  <nav id="list" aria-label="Chats"></nav>
  <button class="ghost" id="exp"><svg class="i"><use href="#i-save"/></svg>Exportar memoria (.lua)</button>
  <div class="acct"><div class="av"><svg class="i"><use href="#i-user"/></svg></div><div><b>Guest</b><small id="dev"></small></div></div>
 </aside>
 <main>
  <header><button class="ib" id="menu" aria-label="Abrir menú"><svg class="i"><use href="#i-menu"/></svg></button><span id="title">Nuevo chat</span><span class="st"><i id="dot"></i><span id="st">Conectando…</span></span></header>
  <div id="msgs"></div>
  <form id="form"><textarea id="in" rows="1" placeholder="Escribe a Lumora…"></textarea><button class="send" id="send" aria-label="Enviar"><svg class="i"><use href="#i-send"/></svg></button></form>
 </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
