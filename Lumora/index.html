<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lumora AI</title>
<meta name="theme-color" content="#0d0d0e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="dots" aria-hidden="true"></canvas>
<div class="scrim" id="scrim"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h4"/></symbol>
<symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 4v7h-7"/></symbol>
<symbol id="i-thumb" viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-8a2 2 0 0 1 2 2v4h6a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></symbol>
<symbol id="i-world" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></symbol>
<symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11l-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
<g id="worldmap"><path d="M8 12L30 9L50 13L56 22L48 30L42 40L36 47L30 41L22 35L14 27Z M60 5L74 5L71 14L62 14Z M38 50L48 49L56 58L52 72L43 90L39 78L37 62Z M92 18L108 15L113 24L102 30L91 28Z M92 32L111 32L119 46L113 66L103 76L96 63L90 47Z M113 12L150 9L177 18L173 34L157 45L141 51L127 41L117 31Z M131 40L143 40L138 55Z M157 62L177 62L181 74L165 79L155 72Z" fill="#fff"/></g>
<clipPath id="gclip"><circle cx="50" cy="50" r="47"/></clipPath>
<radialGradient id="gshade" cx="38%" cy="35%" r="75%"><stop offset="52%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".72"/></radialGradient>
</defs></svg>

<div class="app">
 <aside id="side" aria-label="Barra lateral">
  <div class="side-top"><div class="brand">Lumora <em>AI</em></div><button class="ib" id="sbClose" aria-label="Cerrar barra lateral"><svg class="i"><use href="#i-panel"/></svg></button></div>
  <button class="newbtn" id="new"><svg class="i"><use href="#i-plus"/></svg>Nuevo chat</button>
  <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" placeholder="Buscar chats por nombre" autocomplete="off"></label>
  <nav id="list" aria-label="Chats"></nav>
  <button class="acct" id="acct" aria-label="Abrir configuración"><span class="av">G</span><span class="acct-t"><b>Guest</b><small id="dev"></small></span><svg class="i gear"><use href="#i-gear"/></svg></button>
 </aside>

 <main id="main" class="is-empty">
  <header><button class="ib" id="menu" aria-label="Abrir barra lateral"><svg class="i"><use href="#i-panel"/></svg></button><span id="title">Nuevo chat</span><span class="st"><i id="dot"></i><span id="st">Conectando…</span></span></header>
  <div id="msgs"></div>
  <div class="dock">
   <div class="chips" id="chips"></div>
   <form class="composer" id="form">
    <textarea id="in" rows="1" placeholder="Pregunta, adjunta un archivo o crea algo…" aria-label="Mensaje"></textarea>
    <div class="bar">
     <button type="button" class="pill sq" id="plus" aria-label="Más opciones" aria-haspopup="menu" aria-expanded="false"><svg class="i"><use href="#i-plus"/></svg></button>
     <button type="button" class="pill tog" id="tThink" aria-pressed="false" title="Mostrar el razonamiento antes de responder"><svg class="i"><use href="#i-bulb"/></svg><span class="lb">Pensar</span></button>
     <button type="button" class="pill tog" id="tWeb" aria-pressed="false" title="Buscar en internet para dar información real"><svg class="i"><use href="#i-world"/></svg><span class="lb">Buscar</span></button>
     <span class="grow"></span>
     <button type="button" class="pill mdl" id="modelBtn" aria-haspopup="menu" aria-expanded="false"><span id="mname">pro-coder-v2</span><svg class="i"><use href="#i-chev"/></svg></button>
     <button class="send" id="send" aria-label="Enviar" disabled><svg class="i"><use href="#i-send"/></svg></button>
    </div>
   </form>
   <div class="suggest" id="suggest">
    <button type="button" data-a="site"><svg class="i"><use href="#i-code"/></svg>Crea un sitio web</button>
    <button type="button" data-a="script"><svg class="i"><use href="#i-edit"/></svg>Escribe un script</button>
    <button type="button" data-a="file"><svg class="i"><use href="#i-clip"/></svg>Edita un archivo</button>
   </div>
   <div class="hint">Lumora puede cometer errores. Verifica la información importante.</div>
  </div>
 </main>
</div>

<div class="modal" id="modal" hidden>
 <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="sheet-h"><h2 id="mt">Configuración</h2><button class="ib" id="mClose" aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="who"><span class="av big">G</span><div><b>Guest</b><small id="dev2"></small></div></div>
  <h3>Memoria y entrenamiento</h3>
  <button class="row" id="exp"><svg class="i"><use href="#i-save"/></svg><span><b>Exportar memoria (.lua)</b><small>Lo que Lumora recuerda, para guardarlo en tu repo.</small></span></button>
  <button class="row" id="ds"><svg class="i"><use href="#i-down"/></svg><span><b>Exportar datos de entrenamiento</b><small>Respuestas con «Me gusta», sin datos personales.</small></span></button>
  <button class="row" id="fg"><svg class="i"><use href="#i-retry"/></svg><span><b>Olvidar lo aprendido</b><small>Borra los recuerdos que pidió guardar el usuario.</small></span></button>
  <h3>Datos</h3>
  <button class="row danger" id="wipe"><svg class="i"><use href="#i-trash"/></svg><span><b>Borrar todos los chats</b><small>Solo en este dispositivo. No se puede deshacer.</small></span></button>
 </div>
</div>
<input type="file" id="file" hidden accept=".txt,.md,.js,.mjs,.ts,.jsx,.tsx,.json,.html,.htm,.css,.scss,.lua,.luau,.py,.csv,.xml,.yml,.yaml,.sh,.bat,.ps1,.java,.c,.h,.cpp,.cs,.php,.sql,.ini,.cfg,.toml,.rb,.go,.rs,.kt,.swift,text/*">
<script type="module" src="js/app.js"></script>
</body>
</html>
